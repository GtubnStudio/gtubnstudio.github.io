<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gtubn Studio 的网站 - 主页</title>

  <link rel="icon" href="media/weblogo.png" type="image/png">
  <link rel="icon" href="media/weblogo.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="media/weblogo.png">
  <meta name="apple-mobile-web-app-title" content="Gtubn Studio">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="./assets/css/material-symbols.css">

  <script>
    (function() {
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (systemPrefersLight) {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

  <style>
    :root {
      --md-sys-color-background: #121316;
      --md-sys-color-surface: #121316;
      --md-sys-color-surface-container: #1a1b1f;
      --md-sys-color-surface-container-high: #202125;
      --md-sys-color-on-surface: #e2e2e6;
      --md-sys-color-on-surface-variant: #c4c6cf;
      --md-sys-color-outline: #44474f;

      --md-sys-color-primary: #e5a93c;
      --md-sys-color-primary-container: rgba(229, 169, 60, 0.16);

      --md-shape-corner-full: 9999px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-medium: 12px;

      --md-easing: cubic-bezier(0.2, 0, 0, 1);
    }

    html.light-mode {
      --md-sys-color-background: #fbf7f0;
      --md-sys-color-surface: #fbf7f0;
      --md-sys-color-surface-container: #f3ece0;
      --md-sys-color-surface-container-high: #eae1d0;
      --md-sys-color-on-surface: #1c1b1e;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8bdab;

      --md-sys-color-primary: #e5a93c;
      --md-sys-color-primary-container: rgba(138, 90, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s var(--md-easing), color 0.3s var(--md-easing);
    }

    .ripple-surface {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.15);
      transform: scale(0);
      animation: ripple-anim 1000ms var(--md-easing) forwards;
      pointer-events: none;
      will-change: transform, opacity;
    }

    html.light-mode .ripple {
      background-color: rgba(0, 0, 0, 0.1);
    }

    @keyframes ripple-anim {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    .top-app-bar {
      height: 64px;
      background-color: var(--md-sys-color-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--md-sys-color-outline);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .app-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--md-shape-corner-full);
      border: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    html.light-mode .icon-btn:hover {
      background-color: rgba(0, 0, 0, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 500;
      user-select: none;
    }

    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero-section {
      margin-bottom: 32px;
    }

    .hero-title {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.95rem;
    }

    .search-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-large);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-card:focus-within, .search-card:hover {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface-container-high);
    }

    .search-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--md-sys-color-background);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-medium);
      padding: 0 8px 0 12px;
      height: 48px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .search-input-box:focus-within {
      border-color: var(--md-sys-color-primary);
    }

    .engine-select {
      background: transparent;
      border: none;
      color: var(--md-sys-color-primary);
      font-size: 0.875rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      padding-right: 4px;
    }

    .engine-select option {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--md-sys-color-on-surface);
      font-size: 0.9375rem;
    }

    .search-input::placeholder {
      color: var(--md-sys-color-on-surface-variant);
    }

    .search-submit-btn {
      border: none;
      background: transparent;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
    }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s var(--md-easing), visibility 0.4s var(--md-easing);
      z-index: 20;
    }

    .drawer-scrim.open {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 300px;
      background-color: var(--md-sys-color-surface-container);
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.4s var(--md-easing), background-color 0.3s;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-top-right-radius: var(--md-shape-corner-large);
      border-bottom-right-radius: var(--md-shape-corner-large);
      will-change: transform;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--md-sys-color-outline);
      margin: -12px -12px 12px -12px;
    }

    .drawer-footer {
      padding: 16px;
      border-top: 1px solid var(--md-sys-color-outline);
      margin: 12px -12px -12px -12px;
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.8;
    }

    .drawer-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 500;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      padding: 0 16px;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface-variant);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateX(-20px);
      transition: background-color 0.2s, 
                  color 0.2s, 
                  transform 0.4s var(--md-easing), 
                  opacity 0.4s var(--md-easing);
    }

    .drawer.open .drawer-item {
      opacity: 1;
      transform: translateX(0);
      transition-delay: calc(0.04s * var(--idx) + 0.08s);
    }

    .drawer-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--md-sys-color-on-surface);
    }

    html.light-mode .drawer-item:hover {
      background-color: rgba(0, 0, 0, 0.06);
    }

    .drawer-item.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
    }

    .drawer-item .material-symbols-outlined {
      font-size: 24px;
    }

    .drawer-item.active .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="app-bar-left">
      <button class="icon-btn ripple-surface" id="menuBtn" aria-label="打开导航抽屉">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand">
        <span>Gtubn Studio 的网站 - 主页</span>
      </div>
    </div>

    <button class="icon-btn ripple-surface" id="themeToggleBtn" aria-label="切换明暗主题">
      <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
    </button>
  </header>

  <!-- Navigation Drawer -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span>Gtubn Studio 的网站</span>
      </div>
    </div>

    <a href="./home.html" class="drawer-item active ripple-surface" style="--idx: 1;">
      <span class="material-symbols-outlined">home</span>
      <span>主页</span>
    </a>
    <a href="./sources.html" class="drawer-item ripple-surface" style="--idx: 2;">
      <span class="material-symbols-outlined">folder_open</span>
      <span>资源中心</span>
    </a>
    <a href="./about.html" class="drawer-item ripple-surface" style="--idx: 3;">
      <span class="material-symbols-outlined">info</span>
      <span>关于</span>
    </a>

    <div class="drawer-footer">
      <p>For testing only. This is currently a BETA version and may contain bugs.</p>
    </div>
  </nav>

  <!-- 主页面内容区域 -->
  <main class="main-container">
    <section class="hero-section">
      <h1 class="hero-title">欢迎来到 Gtubn Studio 的网站！</h1>
      <p class="hero-subtitle">海内存知己，天涯若比邻。</p>
    </section>

    <section>
      <div class="search-card">
        <div class="search-card-header">
          <span class="material-symbols-outlined" style="color: var(--md-sys-color-primary);">search</span>
          <span>网络搜索</span>
        </div>
        <form id="unifiedSearchForm" action="https://www.google.com/search" method="get" target="_blank" class="search-input-box">
          <select id="engineSelect" class="engine-select" aria-label="选择搜索引擎">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
          </select>
          <input type="text" name="q" class="search-input" placeholder="输入关键词发起搜索..." required>
          <button type="submit" class="search-submit-btn ripple-surface" aria-label="发起搜索">
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');

    const updateThemeIcon = () => {
      const isLight = document.documentElement.classList.contains('light-mode');
      themeIcon.textContent = isLight ? 'dark_mode' : 'light_mode';
    };

    updateThemeIcon();

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('light-mode');
      updateThemeIcon();
    });

    colorSchemeQuery.addEventListener('change', (e) => {
      if (e.matches) {
        document.documentElement.classList.add('light-mode');
      } else {
        document.documentElement.classList.remove('light-mode');
      }
      updateThemeIcon();
    });

    const drawer = document.getElementById('drawer');
    const drawerScrim = document.getElementById('drawerScrim');

    const toggleDrawer = () => {
      const isOpen = drawer.classList.toggle('open');
      drawerScrim.classList.toggle('open', isOpen);
    };

    document.getElementById('menuBtn').addEventListener('click', toggleDrawer);
    drawerScrim.addEventListener('click', toggleDrawer);

    const searchForm = document.getElementById('unifiedSearchForm');
    const engineSelect = document.getElementById('engineSelect');

    engineSelect.addEventListener('change', (e) => {
      if (e.target.value === 'bing') {
        searchForm.action = 'https://www.bing.com/search';
      } else {
        searchForm.action = 'https://www.google.com/search';
      }
    });

    document.addEventListener('click', (e) => {
      const target = e.target.closest('.ripple-surface');
      if (!target) return;

      const circle = document.createElement('span');
      const diameter = Math.max(target.clientWidth, target.clientHeight);
      const radius = diameter / 2;
      const rect = target.getBoundingClientRect();

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.className = 'ripple';

      target.appendChild(circle);

      setTimeout(() => circle.remove(), 1000);

      const link = target.closest('a');
      if (link && link.href && !link.target && !link.href.startsWith('javascript:')) {
        e.preventDefault();
        const href = link.href;
        setTimeout(() => {
          window.location.href = href;
        }, 300);
      }
    });
  </script>

</body>
</html>
